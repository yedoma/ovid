# Runs every test suite (run_all_tests.R) on each push and pull request, on Linux, macOS and Windows (Windows runs the
# parallel steps with a PSOCK cluster instead of forking, so it is the one place those are proved), with the R and package
# versions pinned in build/renv.lock, so a change that breaks another app is caught before
# anyone installs it. callr is installed too: without it the apps run pipelines in their own process, and the tests of
# runs in the background would not run.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # R itself as the lockfile pins it, like the runtimes: "release" moved to 4.6.2 on its own and RS's tests changed with it
      - name: R version from the lockfile
        id: rver
        shell: bash
        run: echo "r=$(jq -r .R.Version build/renv.lock)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rver.outputs.r }}
          use-public-rspm: true

      # The binaries link to system libraries the runner does not have: NetCDF (ncdf4), Node (V8: libnode.so.109, which
      # Ubuntu 24.04's libnode-dev provides), curl and libuv; cmake and pandoc are what renv lists for building and the docs.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnetcdf-dev libnode-dev libcurl4-openssl-dev libuv1-dev cmake pandoc

      # ncdf4 has no binary for this runner's macOS: built from source, it needs NetCDF's nc-config
      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install netcdf

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/renv.lock') }}

      - name: Install the pinned packages
        run: |
          install.packages("renv")
          renv::restore(lockfile = "build/renv.lock", library = .libPaths()[1], prompt = FALSE)
          for (p in c("V8", "chromote", "processx", "callr")) if (!requireNamespace(p, quietly = TRUE)) install.packages(p)
        shell: Rscript {0}

      - name: Run all tests
        run: Rscript run_all_tests.R
