<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="RS processing pipeline" style="width:100%;height:auto;font:13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="960" height="390" fill="#282c34"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#999999"/></marker></defs>
<rect x="20" y="20" width="291" height="58" rx="8" fill="#383c44" stroke="#999999" stroke-width="1.5"/>
<text x="32" y="43" fill="#999999" font-weight="600">0. Set-up check</text>
<text x="32" y="64" fill="#bcbfc4" font-size="12">sources, rules, sites, links</text>
<rect x="335" y="20" width="291" height="58" rx="8" fill="#383c44" stroke="#61afe7" stroke-width="1.5"/>
<text x="347" y="43" fill="#61afe7" font-weight="600">1. Scan sources</text>
<text x="347" y="64" fill="#bcbfc4" font-size="12">list files; reuse unchanged folders</text>
<rect x="649" y="20" width="291" height="58" rx="8" fill="#383c44" stroke="#61afe7" stroke-width="1.5"/>
<text x="661" y="43" fill="#61afe7" font-weight="600">2. Formats and roles</text>
<text x="661" y="64" fill="#bcbfc4" font-size="12">image, record, track, dataset…</text>
<rect x="649" y="110" width="291" height="58" rx="8" fill="#383c44" stroke="#56b6c2" stroke-width="1.5"/>
<text x="661" y="133" fill="#56b6c2" font-weight="600">3. Read images</text>
<text x="661" y="154" fill="#bcbfc4" font-size="12">first 64 kB: EXIF, XMP, RTK flag</text>
<rect x="335" y="110" width="291" height="58" rx="8" fill="#383c44" stroke="#56b6c2" stroke-width="1.5"/>
<text x="347" y="133" fill="#56b6c2" font-weight="600">4. Time zones</text>
<text x="347" y="154" fill="#bcbfc4" font-size="12">local camera clocks to UTC</text>
<rect x="20" y="110" width="291" height="58" rx="8" fill="#383c44" stroke="#e5c07b" stroke-width="1.5"/>
<text x="32" y="133" fill="#e5c07b" font-weight="600">5. Flights</text>
<text x="32" y="154" fill="#bcbfc4" font-size="12">split at gaps over 10 min; copies merged</text>
<rect x="20" y="200" width="291" height="58" rx="8" fill="#383c44" stroke="#e5c07b" stroke-width="1.5"/>
<text x="32" y="223" fill="#e5c07b" font-weight="600">6. Link files</text>
<text x="32" y="244" fill="#bcbfc4" font-size="12">score: auto ≥ 0.8, probable ≥ 0.5</text>
<rect x="335" y="200" width="291" height="58" rx="8" fill="#383c44" stroke="#98c379" stroke-width="1.5"/>
<text x="347" y="223" fill="#98c379" font-weight="600">7. Positioning status</text>
<text x="347" y="244" fill="#bcbfc4" font-size="12">RTK flag ≥ 95 % fixed; accuracy ≤ 0.1 m</text>
<rect x="649" y="200" width="291" height="58" rx="8" fill="#383c44" stroke="#98c379" stroke-width="1.5"/>
<text x="661" y="223" fill="#98c379" font-weight="600">8. Geometry</text>
<text x="661" y="244" fill="#bcbfc4" font-size="12">planned, observed, derived</text>
<rect x="649" y="290" width="291" height="58" rx="8" fill="#383c44" stroke="#c688cd" stroke-width="1.5"/>
<text x="661" y="313" fill="#c688cd" font-weight="600">9. Datasets and GIS</text>
<text x="661" y="334" fill="#bcbfc4" font-size="12">headers, footprints, layers</text>
<rect x="335" y="290" width="291" height="58" rx="8" fill="#383c44" stroke="#ee9360" stroke-width="1.5"/>
<text x="347" y="313" fill="#ee9360" font-weight="600">10. Your decisions</text>
<text x="347" y="334" fill="#bcbfc4" font-size="12">config/flights, links, sites</text>
<rect x="20" y="290" width="291" height="58" rx="8" fill="#383c44" stroke="#ee9360" stroke-width="1.5"/>
<text x="32" y="313" fill="#ee9360" font-weight="600">11. Catalogue and audit</text>
<text x="32" y="334" fill="#bcbfc4" font-size="12">flights.csv, links.csv, file_audit.csv</text>
